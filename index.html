?", "Scenario ID": "GEN-030", "Category": "Fire safety", "What happened?": "Client having a meeting, main walkway blocked with people sitting on chairs. Hazard as this is also a fire exit route and should not be blocked.", "Key learning": "Fire precautions, escape routes and occupancy controls must remain effective and unobstructed at all times."}, {"Manager observation prompt": "During your walk, can you see any damaged cables, exposed sockets, overloaded leads or electrical equipment that should be isolated?", "Scenario ID": "GEN-031", "Category": "Electrical safety", "What happened?": "Cables hanging from the television all over floor. Trip hazard.", "Key learning": "Damaged, poorly routed or faulty electrical equipment must be isolated and reported before it creates a shock, trip or fire risk."}, {"Manager observation prompt": "During your walk, what could cause someone to slip, trip or fall, and has it been removed or effectively controlled?", "Scenario ID": "GEN-032", "Category": "Slips, trips and falls", "What happened?": "Two leaks found coming from ceiling. Slip hazards.", "Key learning": "Remove or control slip and trip hazards promptly, using barriers or warning signs until a permanent repair is completed."}, {"Manager observation prompt": "During your walk, what could cause someone to slip, trip or fall, and has it been removed or effectively controlled?", "Scenario ID": "GEN-033", "Category": "Slips, trips and falls", "What happened?": "Team member using the step ladder only one foot was on the step & her knee on another.", "Key learning": "Remove or control slip and trip hazards promptly, using barriers or warning signs until a permanent repair is completed."}, {"Manager observation prompt": "During your walk, what could cause someone to slip, trip or fall, and has it been removed or effectively controlled?", "Scenario ID": "GEN-034", "Category": "Slips, trips and falls", "What happened?": "There is a leak in B6e which has left a large puddle of water
